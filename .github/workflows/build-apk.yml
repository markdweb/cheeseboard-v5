name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and accept licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect outputs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ColorGrid-debug.apk
          zip -r dist/ColorGrid-Android-Source.zip . \
            -x ".git/*" "dist/*" "*/build/*" "build/*" ".gradle/*" "*/.gradle/*" \
               ".idea/*" "*.iml" "local.properties" "*.apk"
          ls -lh dist

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ColorGrid-debug-apk
          path: dist/ColorGrid-debug.apk
          if-no-files-found: error

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ColorGrid-Android-Source
          path: dist/ColorGrid-Android-Source.zip
          if-no-files-found: error
